name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - name: Verify tag matches package.json
        shell: bash
        run: |
          package_version="$(bun -e 'import pkg from "./package.json" with { type: "json" }; console.log(pkg.version)')"
          test "${GITHUB_REF_NAME#v}" = "$package_version" || {
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version" >&2
            exit 1
          }
      - run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
        id: bun-cache
        shell: bash
      - uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          # Shares the checks cache key: this job also runs lint (bun@canary)
          key: ${{ runner.os }}-bun-checks-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint -- --max-warnings 0
      - run: bun test --parallel ./test

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - name: Package release archive
        shell: bash
        run: |
          mkdir -p dist staging
          cp -R package.json bun.lock src templates README.md LICENSE staging/
          (cd staging && bun install --production --frozen-lockfile)
          tar -C staging -czf dist/fleet.tar.gz .
          (cd dist && sha256sum fleet.tar.gz > fleet.tar.gz.sha256)
          cp install.sh dist/install.sh
          cp install.sh dist/fleet.sh
          cp install.ps1 dist/install.ps1
      - name: Smoke-test release archive with install.sh
        shell: bash
        run: |
          sh -n dist/install.sh
          temporary_home="$(mktemp -d)"
          mkdir -p "$temporary_home/.local/bin"
          HOME="$temporary_home" \
            SHELL=/bin/bash \
            PATH="$temporary_home/.local/bin:$(dirname "$(command -v bun)"):$PATH" \
            FLEET_ARCHIVE="$PWD/dist/fleet.tar.gz" \
            FLEET_NO_INSTALL_BUN=1 \
            sh ./dist/install.sh
          test "$("$temporary_home/.local/bin/fleet" --version)" = "Fleet ${GITHUB_REF_NAME#v}"
          rm -rf "$temporary_home"
      - uses: actions/upload-artifact@v7
        with:
          name: fleet-release
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: fleet-release
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
