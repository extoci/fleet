name: CI (web)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
        id: bun-cache
        shell: bash
      - uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: ${{ runner.os }}-bun-web-${{ hashFiles('web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-web-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck && bun run format:check && bun run lint -- --max-warnings 0
      - run: bun test

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
        id: bun-cache
        shell: bash
      - uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: ${{ runner.os }}-bun-web-${{ hashFiles('web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-web-
      - run: bun install --frozen-lockfile
      - run: bun run build && bun run test:production

  web-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
        id: bun-cache
        shell: bash
      - uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: ${{ runner.os }}-bun-web-${{ hashFiles('web/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-web-
      - run: bun install --frozen-lockfile
      - run: bun run build:vercel && bun run test:vercel
