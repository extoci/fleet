name: CI (web)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/ci-web.yml"
      - "!**/*.md"
      - "!LICENSE"
      - "!AGENTS.md"
  pull_request:
    paths:
      - "web/**"
      - "scripts/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/ci-web.yml"
      - "!**/*.md"
      - "!LICENSE"
      - "!AGENTS.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          # Separate key: lint pulls bun@canary into the cache, keep it out of the shared one
          key: ${{ runner.os }}-bun-web-checks-${{ hashFiles('web/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check && bun run typecheck && bun run format:check && bun run lint -- --max-warnings 0
      - run: bun test

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-web-${{ hashFiles('web/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build && bun run test:production

  web-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-web-${{ hashFiles('web/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build:vercel && bun run test:vercel
