name: CI

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!web/**"
      - "web/public/**"
      - "!**/*.md"
      - "!docs/**"
      - "!LICENSE"
      - "!AGENTS.md"
      - "!.github/workflows/ci-web.yml"
      - "!.github/workflows/release.yml"
  pull_request:
    paths:
      - "**"
      - "!web/**"
      - "web/public/**"
      - "!**/*.md"
      - "!docs/**"
      - "!LICENSE"
      - "!AGENTS.md"
      - "!.github/workflows/ci-web.yml"
      - "!.github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
        id: bun-cache
        shell: bash
      - uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          # Separate key: lint pulls bun@canary into the cache, keep it out of the shared one
          key: ${{ runner.os }}-bun-checks-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check && bun run lint -- --max-warnings 0

  fleet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"
        id: bun-cache
        shell: bash
      - uses: actions/cache@v4
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun test --parallel ./test
